# =========================================================================
# Demo 3 — the boundary: a firstAvailable claim UNDER a Kueue queue
# =========================================================================
# The same accel-first-available (firstAvailable) claim, but as a Kueue Job
# (queue label present). This exists to DOCUMENT the limitation empirically
# rather than assert it: Kueue's DRA quota counting supports only `exactly`
# device requests — `firstAvailable` and `All` are unsupported
# (https://kueue.sigs.k8s.io/docs/tasks/run/dra/).
#
# OBSERVED (Kueue v0.17.3 on 2026-07-09 AND v0.18.3 on 2026-07-16, same result):
# Kueue REJECTS this Job as Inadmissible — Workload condition QuotaReserved=False
# reason=Inadmissible, message "ResourceClaimTemplate accel-first-available:
# FirstAvailable device selection is not supported"; the Job stays Suspended and
# nothing is quota-counted. (Earlier drafts predicted a soft "admit on cpu/memory
# only" — that prediction never held on either version.) Re-capture with:
#   kubectl -n dra-unified get workloads -o wide
#   kubectl -n dra-unified describe job dra-unified-firstavailable-job | tail -30
# Captured: results-v0.18.3-20260716/03-check3-firstavailable-under-kueue.txt
# =========================================================================
apiVersion: batch/v1
kind: Job
metadata:
  name: dra-unified-firstavailable-job
  namespace: dra-unified
  labels:
    kueue.x-k8s.io/queue-name: dra-unified-lq
spec:
  parallelism: 1
  completions: 1
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      containers:
      - name: compute
        image: registry.k8s.io/e2e-test-images/agnhost:2.53
        command: ["/bin/sh", "-c"]
        args:
          - 'echo "firstAvailable job at $(date)"; sleep 20; echo done'
        resources:
          claims:
          - name: compute
          requests:
            cpu: "100m"
            memory: "64Mi"
      resourceClaims:
      - name: compute
        resourceClaimTemplateName: accel-first-available
