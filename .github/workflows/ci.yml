name: CI

"on":
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  PYTHONPATH: src:.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  OPA_VERSION: v1.15.1

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Verify file structure
        run: python3 scripts/verify.py

      - name: Lint
        run: python3 -m ruff check .

      - name: Type check
        run: python3 -m mypy src/orbital_mission_compiler

      # OPA must be on PATH before the test suite: the pipeline is fail-closed on
      # the 'opa' engine by default, so the CLI tests exercise the real policy path
      # rather than skipping or erroring on a missing binary.
      - name: Cache OPA binary
        uses: actions/cache@v4
        id: opa-cache
        with:
          path: ~/.local/bin/opa
          key: opa-${{ env.OPA_VERSION }}-linux-amd64

      - name: Install OPA
        if: steps.opa-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          TMP_DIR="$(mktemp -d)"
          trap 'rm -rf "$TMP_DIR"' EXIT
          mkdir -p "$HOME/.local/bin"
          OPA_BASE_URL="https://openpolicyagent.org/downloads/${OPA_VERSION}"
          curl -fSL -o "$TMP_DIR/opa_linux_amd64_static" \
            "${OPA_BASE_URL}/opa_linux_amd64_static"
          curl -fSL -o "$TMP_DIR/opa_linux_amd64_static.sha256" \
            "${OPA_BASE_URL}/opa_linux_amd64_static.sha256"
          (
            cd "$TMP_DIR"
            sha256sum -c "opa_linux_amd64_static.sha256"
          )
          install -m 0755 "$TMP_DIR/opa_linux_amd64_static" "$HOME/.local/bin/opa"
          chmod +x "$HOME/.local/bin/opa"

      - name: Verify OPA checksum
        run: |
          set -euo pipefail
          OPA_BASE_URL="https://openpolicyagent.org/downloads/${OPA_VERSION}"
          EXPECTED_SHA="$(curl -fsSL "${OPA_BASE_URL}/opa_linux_amd64_static.sha256" | awk '{print $1}')"
          ACTUAL_SHA="$(sha256sum "$HOME/.local/bin/opa" | awk '{print $1}')"
          test -n "$EXPECTED_SHA"
          test "$EXPECTED_SHA" = "$ACTUAL_SHA"

      - name: Add OPA to PATH and verify
        run: |
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/opa" version

      - name: Unit tests with coverage
        run: |
          python3 -m pytest -q --cov=orbital_mission_compiler --cov-report=term-missing --cov-report=xml --cov-fail-under=70

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: coverage.xml
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

      # The default policy path uses the packaged Rego bundle, and an editable
      # install resolves it from the source tree either way. Build and install the
      # real artifact so a bundle missing from the wheel is caught here rather
      # than by whoever pip-installs it.
      - name: Wheel install smoke (default policy path from a clean venv)
        run: |
          set -euo pipefail
          python3 -m pip install --quiet build
          rm -rf dist
          python3 -m build --wheel
          python3 - <<'PYCHK'
          import glob, zipfile
          wheel = glob.glob("dist/*.whl")[0]
          entries = zipfile.ZipFile(wheel).namelist()
          assert "orbital_mission_compiler/policies/mission_plan.rego" in entries, entries
          print(f"wheel ships the policy bundle: {wheel}")
          PYCHK
          python3 -m venv /tmp/wheel-venv
          /tmp/wheel-venv/bin/pip install --quiet dist/*.whl
          workdir="$(mktemp -d)"
          plan="$PWD/configs/mission_plans/sample_gpu_cpu_fallback.yaml"
          cd "$workdir"
          /tmp/wheel-venv/bin/python -m orbital_mission_compiler.cli compile \
            --input "$plan" --output "$workdir/out.json"
          test -s "$workdir/out.json"
          echo "installed wheel resolved the default bundle from $workdir"

      - name: Golden evals
        run: python3 -m orbital_mission_compiler.eval_runner

      - name: OPA smoke (valid plans pass, deny fixtures are rejected)
        run: |
          # opa_smoke.sh now gates on the decision, so a plan that the policy
          # rejects fails the step. demo_gpu_no_fallback.yaml exists to BE
          # rejected (Rego Rule 4), so it is asserted separately: looping it in
          # with the plans that must pass would just fail the build, and merely
          # skipping it would leave the gate's reject path unverified.
          DENY_FIXTURES=("demo_gpu_no_fallback.yaml")
          for plan in configs/mission_plans/*.yaml; do
            base="$(basename "$plan")"
            skip=""
            for deny in "${DENY_FIXTURES[@]}"; do
              [ "$base" = "$deny" ] && skip=1 && break
            done
            if [ -n "$skip" ]; then
              continue
            fi
            bash scripts/opa_smoke.sh "$plan"
          done
          for deny in "${DENY_FIXTURES[@]}"; do
            echo "Asserting the policy gate rejects the deny fixture: $deny"
            if bash scripts/opa_smoke.sh "configs/mission_plans/$deny"; then
              echo "FAIL: deny fixture $deny was accepted by the policy gate" >&2
              exit 1
            fi
            echo "OK: $deny was rejected as expected"
          done

      - name: Argo smoke (valid plans render, deny fixtures produce no artifact)
        run: |
          # render-argo is fail-closed now, so the deny fixture produces no
          # artifact by design. Assert that rather than looping it in with the
          # plans that must render: a rendered artifact for a policy-denied plan
          # is the exact failure the gate exists to prevent.
          DENY_FIXTURES=("demo_gpu_no_fallback.yaml")
          for plan in configs/mission_plans/*.yaml; do
            base="$(basename "$plan")"
            skip=""
            for deny in "${DENY_FIXTURES[@]}"; do
              [ "$base" = "$deny" ] && skip=1 && break
            done
            if [ -n "$skip" ]; then
              continue
            fi
            # A fresh directory per plan: a shared one lets a previous plan's
            # output satisfy the manifest check, so a plan that silently rendered
            # nothing would still pass.
            plan_out="$(mktemp -d)"
            bash scripts/argo_smoke.sh "$plan" "$plan_out"
            produced="$(find "$plan_out" -name '*.yaml' | wc -l)"
            if [ "$produced" -eq 0 ]; then
              echo "FAIL: $base rendered no manifest" >&2
              exit 1
            fi
            rm -rf "$plan_out"
          done

          # The flagship path of this change: exercise --dra-fallback end to end
          # and check the multi-doc invariants a plain render cannot show.
          dra_out="$(mktemp -d)"
          python3 -m orbital_mission_compiler.cli render-argo \
            --input configs/mission_plans/sample_gpu_cpu_fallback.yaml \
            --output-dir "$dra_out" --namespace dra-smoke-ns --dra-fallback
          python3 - "$dra_out" <<'PYDRA'
          import sys, pathlib, yaml
          docs = []
          for p in pathlib.Path(sys.argv[1]).glob("*.yaml"):
              docs += [d for d in yaml.safe_load_all(p.read_text()) if d]
          kinds = {d["kind"] for d in docs}
          assert {"ResourceClaimTemplate", "Workflow"} <= kinds, kinds
          ns = {d["metadata"].get("namespace") for d in docs}
          assert ns == {"dra-smoke-ns"}, f"namespaces disagree: {ns}"
          ids = [(d["apiVersion"], d["kind"], d["metadata"].get("namespace"),
                  d["metadata"]["name"]) for d in docs]
          assert len(ids) == len(set(ids)), f"duplicate object identity: {ids}"
          rct = next(d for d in docs if d["kind"] == "ResourceClaimTemplate")
          req = rct["spec"]["spec"]["devices"]["requests"][0]
          assert "firstAvailable" in req, req
          wf = next(d for d in docs if d["kind"] == "Workflow")
          wired = [t for t in wf["spec"]["templates"] if "podSpecPatch" in t]
          assert wired, "no template consumes the claim"
          print(f"DRA smoke OK: {len(docs)} docs, namespace dra-smoke-ns, {len(wired)} wired")
          PYDRA
          rm -rf "$dra_out"
          for deny in "${DENY_FIXTURES[@]}"; do
            echo "Asserting render-argo refuses the deny fixture: $deny"
            out="$(mktemp -d)"
            if python3 -m orbital_mission_compiler.cli render-argo \
                 --input "configs/mission_plans/$deny" --output-dir "$out"; then
              echo "FAIL: render-argo produced artifacts for denied plan $deny" >&2
              exit 1
            fi
            if [ -n "$(ls -A "$out")" ]; then
              echo "FAIL: $deny was denied but left artifacts behind in $out" >&2
              exit 1
            fi
            echo "OK: $deny was refused and produced no artifact"
            rm -rf "$out"
          done
